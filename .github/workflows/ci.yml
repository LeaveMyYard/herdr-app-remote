name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm -r test

  visual:
    runs-on: ubuntu-latest
    # Playwright's own image ships the browsers and their system packages, so
    # this job needs no apt. On 2026-11-11 an Ubuntu mirror outage kept
    # `playwright install --with-deps` waiting for 1h40m. Keep the tag equal
    # to @playwright/test in packages/pwa/package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --user 1001
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @herdr-remote/protocol build
      - run: pnpm --filter @herdr-remote/pwa visual
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-diffs
          path: packages/pwa/test-results
          retention-days: 7
